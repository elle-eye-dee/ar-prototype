<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Sculpture Prototype</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f7f4ef;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .page {
      box-sizing: border-box;
      min-height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.15;
      margin: 0;
    }

    p {
      font-size: 15px;
      line-height: 1.35;
      margin: 0;
      max-width: 520px;
    }

    model-viewer {
      width: 100%;
      height: 62vh;
      min-height: 430px;
      background: #ebe6dc;
      border-radius: 18px;
      overflow: hidden;
    }

    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: bold;
      background: #111;
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
      cursor: pointer;
    }

    .ar-failure {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 16px;
      background: white;
      color: #111;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>2</h1>

    <p>
      Tap “View in AR” to place the sculpture in your space.
    </p>

    <model-viewer
      src="group_17_24_23_18_animated_root.glb"
ios-src="group_17_24_23_18.usdz#allowsContentScaling=0"
      alt="AR sculpture prototype"
      ar
ar-placement="floor"
ar-scale="fixed"
      ar-modes="quick-look scene-viewer webxr"
      quick-look-browsers="safari chrome"
      camera-controls
      disable-pan
      disable-zoom
      interaction-prompt="none"
      camera-orbit="0deg 75deg 6m"
      field-of-view="28deg"
      autoplay
      auto-rotate
      rotation-per-second="3deg"
      shadow-intensity="1"
      exposure="1">

      <button slot="ar-button" class="ar-button">View in AR</button>

      <div slot="ar-failure" class="ar-failure">
        AR is not available here. Try Safari on iPhone or Chrome on Android.
      </div>
    </model-viewer>
  </main>
</body>
</html>
